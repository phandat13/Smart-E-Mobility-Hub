services:
  postgres:
    image: postgres:16
    container_name: emobility-db
    environment:
      POSTGRES_DB: emobility
      POSTGRES_USER: emobility
      POSTGRES_PASSWORD: emobility
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: